<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 54" preserveAspectRatio="none">
  <defs>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <style>
    .trail { animation: orbit 10s linear infinite; }
    .head { animation: lead 10s linear infinite; }
    @keyframes orbit { to { stroke-dashoffset: -100; } }
    @keyframes lead { to { stroke-dashoffset: -122; } }
    @media (prefers-reduced-motion: reduce) {
      .trail, .head { animation: none; }
    }
  </style>
  <g fill="none" stroke-linecap="round">
    <rect class="trail" x="4" y="4" width="252" height="46" rx="11" pathLength="100"
      stroke="#f6b942" stroke-width="5" stroke-opacity="0.7" stroke-dasharray="23 27"
      vector-effect="non-scaling-stroke" filter="url(#glow)"/>
    <rect class="trail" x="4" y="4" width="252" height="46" rx="11" pathLength="100"
      stroke="#f7cb71" stroke-width="1.5" stroke-dasharray="23 27"
      vector-effect="non-scaling-stroke"/>
    <rect class="head" x="4" y="4" width="252" height="46" rx="11" pathLength="100"
      stroke="#fff3ce" stroke-width="2" stroke-dasharray="1 49" stroke-dashoffset="-22"
      vector-effect="non-scaling-stroke"/>
  </g>
</svg>
